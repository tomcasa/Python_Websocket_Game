<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>💬 Chat Perso</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 700px;
    margin: 20px auto;
    padding: 0 10px;
    background: #f5f5f5;
  }
  h1 { text-align: center; color: #333; }
  #status {
    text-align: center;
    font-size: 0.9em;
    padding: 5px;
    border-radius: 4px;
    margin-bottom: 10px;
  }
  .online  { background: #d4edda; color: #155724; }
  .offline { background: #f8d7da; color: #721c24; }
  #messages {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    height: 400px;
    overflow-y: auto;
    padding: 15px;
    margin-bottom: 10px;
  }
  #text_game {
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    height: auto;    
    overflow-y: auto;
    width: fit-content;
    padding: 15px;
    margin-bottom: 10px; 
    font-family: monospace;
    white-space: pre;         /* ← conserve espaces ET retours à la ligne */
    margin: 1em 0;            /* ← les marges qui gênent souvent */
    font-size: 13px;          /* variable selon navigateur */
    
  }
  #text_game_box { 
    display:none;  
  }
  .msg {
    margin: 5px 0;
    padding: 6px 10px;
    border-radius: 6px;
    word-wrap: break-word;
    white-space: pre-wrap;   /* ← l'astuce */

  }
  .msg .meta {
    font-size: 0.75em;
    color: #888;
    margin-right: 6px;
  }
  .msg .pseudo { font-weight: bold; color: #0066cc; }
  .msg.message { background: #e7f3ff; }
  .msg.system  {
    background: #fff3cd;
    color: #856404;
    font-style: italic;
    font-size: 0.9em;
    __text-align: center;
  }
  #form {
    display: flex;
    gap: 8px;
  }
  #input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1em;
  }
  button {
    padding: 10px 20px;
    background: #0066cc;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1em;
  }
  button:hover { background: #0052a3; }
  button:disabled { background: #999; cursor: not-allowed; }




  /* ===== Conteneur des boutons : 400px centré ===== */
  .nav-buttons {
    width: 400px;
    max-width: 100%;        /* sécurité si l'écran est plus petit */
    margin: 0 auto;         /* centrage horizontal */
    display: flex;
    gap: 10px;
  }

  .nav-buttons button {
    flex: 1;                /* chaque bouton prend 50% */
    padding: 20px 0;
    font-size: 1.5rem;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background 0.2s;
  }

  .nav-buttons button:active,
  .nav-buttons button.actif {
    background: #0056b3;
  }

</style>
</head>
<body>

<div id="status" class="offline">Connexion...</div>
<div id="text_game_box">
  <div id="text_game" ></div> 
  <div class="nav-buttons">
    <button id="btnGauche" aria-label="Précédent">←</button><br/>
    <button id="btnDroite" aria-label="Suivant">→</button><br/>
  </div>
  <br/>
</div>

<div id="messages"></div>

<form id="form">
  <input id="input" type="text" placeholder="Tapez votre message... (ou /nick <pseudo>)" autocomplete="off" disabled>
  <button type="submit" disabled>Envoyer</button>
</form>

<script>
const statusEl = document.getElementById('status');
const messagesEl = document.getElementById('messages');
const form = document.getElementById('form');
const input = document.getElementById('input');
const button = form.querySelector('button');

let ws = null;

const NICK_KEY = "chat.nick";

 

  const DELAI_LONG_PRESS = 300;
  const INTERVALLE_REPET = 50;
  

function attacherLongPress(btn, action) {
  let timeoutId = null;
  let intervalId = null;

  function demarrer(e) {
    if (e.type === 'mousedown' && e.button !== 0) return;
    e.preventDefault();
    btn.classList.add('actif');

    action(); // déclenchement immédiat

    timeoutId = setTimeout(() => {
      intervalId = setInterval(action, INTERVALLE_REPET);
    }, DELAI_LONG_PRESS);
  }

  function arreter() {
    btn.classList.remove('actif');
    if (timeoutId) { clearTimeout(timeoutId); timeoutId = null; }
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
  }

  btn.addEventListener('mousedown', demarrer);
  btn.addEventListener('mouseup', arreter);
  btn.addEventListener('mouseleave', arreter);

  btn.addEventListener('touchstart', demarrer, { passive: false });
  btn.addEventListener('touchend', arreter);
  btn.addEventListener('touchcancel', arreter);

  btn.addEventListener('contextmenu', e => e.preventDefault());
}

function actionGauche() { 
  sendKey("left")
}

function actionDroite() { 
  sendKey("right")
}

attacherLongPress(document.getElementById('btnGauche'), actionGauche);
attacherLongPress(document.getElementById('btnDroite'), actionDroite);




// --- Lecture au démarrage ---
let savedNick = localStorage.getItem(NICK_KEY) || "";

// --- Écriture à chaque changement de pseudo ---
function saveNick(nick) {
  if (nick) localStorage.setItem(NICK_KEY, nick);
  else localStorage.removeItem(NICK_KEY);
}


function connect() {
    
const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
ws = new WebSocket(`${proto}//${location.host}/ws/`);

  ws.onopen = () => {
    statusEl.textContent = '✅ Connecté';
    statusEl.className = 'online';
    input.disabled = false;
    button.disabled = false;
    input.focus();

        
    // 1. Restaurer le pseudo dès l'ouverture
    const nick = localStorage.getItem(NICK_KEY);
    if (nick) {
        console.info(`nick ${nick}`)
        ws.send(JSON.stringify({ text:`/nick ${nick}` }));
        //ws.send(JSON.stringify({ text:`/figlet -h` }));
        //ws.send(JSON.stringify({ text:`/text_game start` }));
    } 

  };

  ws.onclose = () => {
    statusEl.textContent = '❌ Déconnecté. Reconnexion...';
    statusEl.className = 'offline';
    input.disabled = true;
    button.disabled = true;
    setTimeout(connect, 2000);  // reconnexion auto
  };

  ws.onerror = (err) => {
    console.error('Erreur WebSocket', err);
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    displayMessage(data);
  };
}

function displayMessage(data) {

  console.log(data)
  if (data.tick){

        
    if (data.type === "text_game") {
        document.getElementById("text_game").textContent = data.text 
        var tg = document.getElementById("text_game_box") 
        if ( tg.style.display != 'block') {
            tg.style.display = 'block'
        }
        
    }   
     
  }else{

    const div = document.createElement('div');
    div.className = 'msg ' + data.type;
    
    if (data.type === "figlet") {
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = `[${data.time}] ${data.pseudo} · police ${data.font}`;

        const pre = document.createElement("pre");
        pre.textContent = data.text;   // ← textContent, JAMAIS innerHTML

        div.appendChild(meta);
        div.appendChild(pre);

    } else if (data.type === 'message' || data.type === 'text_g--ame'   ) {
        const meta = document.createElement('span');
        meta.className = 'meta';
        meta.textContent = `[${data.time}]`;
        
        const pseudo = document.createElement('span');
        pseudo.className = 'pseudo';
        pseudo.textContent = data.pseudo + ' : ';
        
        div.appendChild(meta);
        div.appendChild(pseudo);
        div.appendChild(document.createTextNode(data.text));
    } else {
        div.textContent = `[${data.time}] ${data.text}`;
    }

    if (data.type === "system" && (
       data.text ==="Fin du Jeux" ||  data.text ==="Aucun jeu en cours."
    )){
        tg = document.getElementById("text_game_box").style.display = "none"
    }


    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;

  }

}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim(); 
  if (!text || ws.readyState !== WebSocket.OPEN) return;

  if (text.startsWith("/nick ")) {
    const newNick = text.slice(6).trim();
    if (newNick) saveNick(newNick);
    console.log(text)
  } 

  ws.send(JSON.stringify({ text: text }));

  pushHistory(text);                          // ← on mémorise
  draft = "";
  historyIndex = history.length;

  input.value = '';
  input.focus();
});


let history = [];          // messages envoyés (du plus ancien au plus récent)
let historyIndex = 0;      // 0..history.length, égal à length quand on n'est pas dans l'historique
let draft = "";            // ce que l'utilisateur était en train de taper avant de remonter

function pushHistory(text) {
  const trimmed = text.trim();
  if (!trimmed) return;
  // Éviter les doublons consécutifs (comme bash)
  if (history[history.length - 1] === trimmed) return;
  history.push(trimmed);
  if (history.length > 100) history.shift();   // borne la mémoire
  historyIndex = history.length;
}


function sendKey(key, type = "keydown") {
  if (ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    type: "keypress",
    key,            // "left", "right", ...
    event: type,    // "keydown" | "keyup"
  }));
}


const GAME_KEYS = {
  ArrowLeft: "left",
  ArrowRight: "right",
  ArrowUp: "up",
  ArrowDown: "down",
  " ": "space",
};

// ─── Navigation clavier ───
document.body.addEventListener("keydown", (e) => {

  const mapped = GAME_KEYS[e.key];
  if (mapped) {
    //e.preventDefault();   // évite le scroll avec les flèches
    // éviter le repeat auto du navigateur (touche maintenue)
    //if (e.repeat) return;
    sendKey(mapped, "keydown");
  }

  if (e.key === "ArrowUp") {
    e.preventDefault();                        // évite le curseur qui saute en début
    if (history.length === 0) return;

    // Si on entre dans l'historique pour la première fois,
    // on sauvegarde ce que l'utilisateur était en train d'écrire
    if (historyIndex === history.length) {
      draft = input.value;
    }
    if (historyIndex > 0) {
      historyIndex--;
      input.value = history[historyIndex];
      // curseur à la fin
      requestAnimationFrame(() => {
        input.setSelectionRange(input.value.length, input.value.length);
      });
    }
  } 
  if (e.key === "ArrowDown") {
    e.preventDefault();
    if (historyIndex < history.length) {
      historyIndex++;
      if (historyIndex === history.length) {
        input.value = draft;                   // restaure le brouillon
      } else {
        input.value = history[historyIndex];
      }
      requestAnimationFrame(() => {
        input.setSelectionRange(input.value.length, input.value.length);
      });
    }
  }
});


 

connect();
</script>

</body>
</html>
